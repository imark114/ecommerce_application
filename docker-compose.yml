name: ecommerce-application
services:
  pgdb:
    restart: always
    image: postgres
    container_name: pgdb_ecommerce
    environment:
      - POSTGRES_DB=ecommerce
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  esearch:
    container_name: search
    image: elasticsearch:7.17.28
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"